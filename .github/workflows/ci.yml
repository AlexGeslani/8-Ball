name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Build browser artifact
        run: npm run build:web
      - name: Verify generated artifact is committed
        run: git diff --exit-code -- public
      - name: Test
        run: npm test
      - name: Install pinned Zeus CLI
        run: npm install --global @zeppos/zeus-cli@1.9.3
      - name: Build Zepp package
        run: zeus build
      - name: Upload ZAB
        uses: actions/upload-artifact@v7
        with:
          name: 8-ball-zab
          path: dist/*.zab
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    name: deploy-pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Build browser artifact
        run: npm run build:web
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
