name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Build browser artifact
        run: npm run build:web
      - name: Verify generated artifact is committed
        run: git diff --exit-code -- public
      - name: Test
        run: npm test
      - name: Install pinned Zeus CLI
        run: npm install --global @zeppos/zeus-cli@1.9.3
      - name: Build Zepp package
        run: zeus build
      - name: Upload ZAB
        uses: actions/upload-artifact@v7
        with:
          name: 8-ball-zab
          path: dist/*.zab
          if-no-files-found: error
          retention-days: 14
