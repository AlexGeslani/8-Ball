name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm run build:web
      - run: git diff --exit-code -- public
      - run: npm test
      - run: npm install --global @zeppos/zeus-cli@1.9.3
      - run: zeus build
      - name: Create checksums
        run: sha256sum dist/*.zab > dist/SHA256SUMS
      - name: Publish private release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zab
            dist/SHA256SUMS
